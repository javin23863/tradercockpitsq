<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101b"/><stop offset="1" stop-color="#0d1724"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151b4b"/><stop offset="1" stop-color="#101f45"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:36px;font-weight:800;fill:#f3f7ff}.sub{font-size:16px;fill:#9caec2}.nav{font-size:15px;fill:#a9bbcf}.small{font-size:13px;fill:#8ea1b7}.cardTitle{font-size:18px;font-weight:700;fill:#f2f6fb}.label{font-size:13px;font-weight:800;letter-spacing:1.5px}.call{font-size:17px;font-weight:800;fill:#fff}.call2{font-size:14px;fill:#ffd3d3}.mono{font-family:Consolas,monospace;font-size:12px;fill:#8496a9}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#07101b"/>
  <rect x="28" y="26" width="1544" height="948" rx="22" fill="url(#bg)" stroke="#26384c" filter="url(#shadow)"/>

  <!-- left navigation -->
  <rect x="28" y="26" width="230" height="948" rx="22" fill="#09111d"/>
  <circle cx="72" cy="74" r="18" fill="#7a4fff"/><text x="72" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">TC</text>
  <text x="102" y="80" font-size="18" font-weight="800" fill="#f7f9ff">TraderCockpit</text>
  <text x="55" y="128" class="label" fill="#65788f">DEVELOPMENT PRODUCT</text>
  <rect x="45" y="153" width="188" height="44" rx="8" fill="#0e2b45" stroke="#1aa6d9"/>
  <text x="80" y="181" class="nav" fill="#dff8ff">Home</text>
  <text x="56" y="232" class="nav">◇</text><text x="83" y="232" class="nav">Research</text>
  <text x="56" y="278" class="nav">⌕</text><text x="83" y="278" class="nav">Explore</text>
  <text x="56" y="324" class="nav">◔</text><text x="83" y="324" class="nav">Automation</text>
  <text x="56" y="370" class="nav">●</text><text x="83" y="370" class="nav">Operate</text>
  <text x="56" y="416" class="nav">⚙</text><text x="83" y="416" class="nav">Settings</text>
  <rect x="46" y="855" width="162" height="28" rx="14" fill="#08221e" stroke="#1e6656"/><circle cx="62" cy="869" r="4" fill="#36e39b"/><text x="74" y="874" class="small" fill="#9deccc">Application ready</text>
  <rect x="46" y="892" width="178" height="28" rx="14" fill="#221a0a" stroke="#705a20"/><circle cx="62" cy="906" r="4" fill="#f4c44f"/><text x="74" y="911" class="small" fill="#f3da95">Research backend unavailable</text>

  <!-- top chrome -->
  <rect x="258" y="26" width="1314" height="75" fill="#080f18"/>
  <text x="300" y="54" class="label" fill="#65788f">CURRENT PRODUCT SURFACE</text>
  <text x="300" y="79" font-size="16" font-weight="700" fill="#c9d4e2">Home / development trunk</text>
  <rect x="1268" y="48" width="130" height="30" rx="15" fill="#08221e" stroke="#1e6656"/><circle cx="1284" cy="63" r="4" fill="#36e39b"/><text x="1295" y="68" class="small" fill="#9deccc">Application ready</text>
  <rect x="1406" y="48" width="138" height="30" rx="15" fill="#221a0a" stroke="#705a20"/><circle cx="1422" cy="63" r="4" fill="#f4c44f"/><text x="1433" y="68" class="small" fill="#f3da95">Backend unavailable</text>

  <!-- current home -->
  <text x="328" y="153" class="small">HOME</text>
  <text x="328" y="199" class="title">Cockpit Home</text>
  <text x="328" y="228" class="sub">Current market, system, signal, risk, performance, and pipeline orientation.</text>
  <text x="328" y="252" class="sub">Historical strategy research lives in the separate Research workspace.</text>
  <rect x="1400" y="188" width="118" height="38" rx="7" fill="#2b91d1"/><text x="1459" y="212" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Open Research</text>

  <rect x="328" y="285" width="1190" height="205" rx="14" fill="url(#hero)" stroke="#263774"/>
  <text x="360" y="326" class="label" fill="#7f91cf">TRADERCOCKPIT / LIVE ORIENTATION</text>
  <text x="360" y="370" font-size="30" font-weight="800" fill="#fff">See what's happening now, then go to the</text>
  <text x="360" y="408" font-size="30" font-weight="800" fill="#fff">owning workspace.</text>
  <text x="360" y="440" class="small" fill="#a8b8ce">Home is the live/current cockpit. It does not run historical research.</text>
  <rect x="360" y="456" width="110" height="30" rx="6" fill="#0e2f48" stroke="#1f6e96"/><text x="415" y="476" text-anchor="middle" class="small" fill="#d6efff">Open Operate</text>
  <rect x="478" y="456" width="135" height="30" rx="6" fill="#0b2034" stroke="#345068"/><text x="545" y="476" text-anchor="middle" class="small" fill="#d6e1ed">Explore capabilities</text>

  <!-- placeholder panels -->
  <g>
    <rect x="328" y="515" width="580" height="205" rx="12" fill="#0b1521" stroke="#223348"/>
    <text x="350" y="545" class="label" fill="#557a72">MARKET OVERVIEW</text>
    <text x="350" y="575" class="cardTitle">Market context</text>
    <text x="350" y="603" class="small">Live market data not connected</text>
    <rect x="350" y="627" width="536" height="60" rx="8" fill="#0a111a" stroke="#202d3b"/>
    <circle cx="371" cy="657" r="8" fill="#201a0b" stroke="#7b6727"/><text x="391" y="653" class="small" fill="#dfe8f1">Live market data not connected</text>
    <text x="391" y="673" class="small">The Home screen keeps the market zone visible without substituting historical data.</text>
  </g>
  <g>
    <rect x="928" y="515" width="590" height="205" rx="12" fill="#0b1521" stroke="#223348"/>
    <text x="950" y="545" class="label" fill="#8b5763">SYSTEM STATUS</text>
    <text x="950" y="575" class="cardTitle">Runtime attention</text>
    <text x="950" y="605" class="small">Application ready; research runtime, market data, account/model unavailable.</text>
    <text x="950" y="640" class="small">TraderCockpit application</text><text x="1475" y="640" text-anchor="end" class="small" fill="#9ee5c3">Ready</text>
    <text x="950" y="670" class="small">Research backend</text><text x="1475" y="670" text-anchor="end" class="small" fill="#f0c783">Unavailable</text>
    <text x="950" y="700" class="small">Native execution</text><text x="1475" y="700" text-anchor="end" class="small" fill="#f0c783">Disabled</text>
  </g>
  <rect x="328" y="740" width="580" height="180" rx="12" fill="#0b1521" stroke="#223348"/>
  <text x="350" y="770" class="label" fill="#806f99">ALPHA STACK</text><text x="350" y="800" class="cardTitle">Strategy and deployment stack</text><text x="350" y="832" class="small">No current deployed state.</text>
  <rect x="928" y="740" width="590" height="180" rx="12" fill="#0b1521" stroke="#223348"/>
  <text x="950" y="770" class="label" fill="#826f4d">PIPELINE OVERVIEW</text><text x="950" y="800" class="cardTitle">Current pipeline state</text><text x="950" y="832" class="small">No live pipeline producer connected.</text>

  <!-- annotations -->
  <path d="M1170 180 C1240 120 1310 118 1390 128" fill="none" stroke="#ff4d67" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="1120" y="92" width="420" height="90" rx="12" fill="#43131a" stroke="#ff4d67"/>
  <text x="1145" y="125" class="call">VISIBLE PRODUCT IS STILL THE OLD SHELL</text>
  <text x="1145" y="151" class="call2">The user launches this and sees placeholders before the working Research capability.</text>

  <path d="M1010 405 C1100 420 1190 430 1270 450" fill="none" stroke="#ffb84d" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="1050" y="355" width="470" height="95" rx="12" fill="#42280c" stroke="#ffb84d"/>
  <text x="1075" y="388" class="call">WORKING RESEARCH IS VISUALLY SECONDARY</text>
  <text x="1075" y="414" class="call2" fill="#ffe6b3">Deep Builder / Candidate / Retester / Proof work is hidden behind one button.</text>

  <path d="M840 760 C780 790 720 820 660 850" fill="none" stroke="#ff4d67" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="360" y="850" width="500" height="82" rx="12" fill="#43131a" stroke="#ff4d67"/>
  <text x="385" y="882" class="call">UNAVAILABLE LIVE PANELS DOMINATE THE STORY</text>
  <text x="385" y="908" class="call2">Truthful state is good; making it the primary product experience is not.</text>
</svg>