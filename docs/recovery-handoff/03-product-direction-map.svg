<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101a"/><stop offset="1" stop-color="#101825"/></linearGradient>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:38px;font-weight:850;fill:#f7faff}.h2{font-size:20px;font-weight:820;fill:#eef4fb}.body{font-size:14px;fill:#9fb0c3}.small{font-size:12px;fill:#8ea1b6}.eyebrow{font-size:10px;font-weight:850;letter-spacing:1.5px;fill:#71849a}.node{font-size:15px;font-weight:820;fill:#f2f6fc}.milestone{font-size:16px;font-weight:850;fill:#f5f8fc}
    </style>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#050a11"/>
  <rect x="28" y="28" width="1544" height="944" rx="22" fill="url(#bg)" stroke="#26384b" filter="url(#shadow)"/>

  <text x="70" y="88" class="eyebrow">TRADERCOCKPIT — PRODUCT DIRECTION</text>
  <text x="70" y="135" class="h1">One product, three horizons: research → daily use → commercial release</text>
  <text x="70" y="168" class="body">Every coding slice should advance a user-visible journey. Backend seams are supporting architecture, not the roadmap by themselves.</text>

  <!-- product surfaces -->
  <text x="70" y="222" class="eyebrow">CANONICAL USER EXPERIENCE</text>
  <rect x="70" y="244" width="1460" height="145" rx="16" fill="#0b1623" stroke="#2b4053"/>
  <rect x="94" y="270" width="210" height="92" rx="12" fill="#122842" stroke="#318bc1"/><text x="116" y="302" class="node">HOME / COMMAND CENTER</text><text x="116" y="329" class="small">Continue work · readiness · recent evidence</text><text x="116" y="348" class="small">working capability first, unavailable state second</text>
  <path d="M304 316 H338" stroke="#51687f" stroke-width="3"/>
  <rect x="338" y="270" width="250" height="92" rx="12" fill="#172346" stroke="#6659c8"/><text x="360" y="302" class="node">RESEARCH</text><text x="360" y="329" class="small">Idea → Specification → Build → Candidates</text><text x="360" y="348" class="small">Backtest → Robustness → Proof</text>
  <path d="M588 316 H622" stroke="#51687f" stroke-width="3"/>
  <rect x="622" y="270" width="210" height="92" rx="12" fill="#112526" stroke="#367e74"/><text x="644" y="302" class="node">OPERATE</text><text x="644" y="329" class="small">Promoted/deployed strategy state</text><text x="644" y="348" class="small">paper/live execution only when producers exist</text>
  <path d="M832 316 H866" stroke="#51687f" stroke-width="3"/>
  <rect x="866" y="270" width="210" height="92" rx="12" fill="#231c12" stroke="#836637"/><text x="888" y="302" class="node">AUTOMATION</text><text x="888" y="329" class="small">Native project topology/control</text><text x="888" y="348" class="small">SQX executes; TraderCockpit orchestrates</text>
  <path d="M1076 316 H1110" stroke="#51687f" stroke-width="3"/>
  <rect x="1110" y="270" width="190" height="92" rx="12" fill="#171f2b" stroke="#506177"/><text x="1132" y="302" class="node">EXPLORE</text><text x="1132" y="329" class="small">Capabilities · strategies · evidence</text><text x="1132" y="348" class="small">discover without inventing producer truth</text>
  <path d="M1300 316 H1334" stroke="#51687f" stroke-width="3"/>
  <rect x="1334" y="270" width="172" height="92" rx="12" fill="#171f2b" stroke="#506177"/><text x="1356" y="302" class="node">SETTINGS</text><text x="1356" y="329" class="small">SQX · data · account</text><text x="1356" y="348" class="small">model · security · updates</text>

  <!-- ownership -->
  <text x="70" y="438" class="eyebrow">OWNERSHIP BOUNDARY</text>
  <rect x="70" y="458" width="700" height="180" rx="15" fill="#0c1724" stroke="#2f4d67"/>
  <text x="96" y="493" class="h2">TraderCockpit owns the product</text>
  <text x="96" y="526" class="body">Desktop lifecycle · UX · navigation · accounts · custody · configuration review</text>
  <text x="96" y="552" class="body">runtime verification/control · Candidate/Backtest/Proof presentation · durable state</text>
  <text x="96" y="588" class="small" fill="#8edbff">Goal: make complex native capability understandable and safe to operate.</text>

  <rect x="800" y="458" width="730" height="180" rx="15" fill="#0c1724" stroke="#4d446e"/>
  <text x="826" y="493" class="h2">StrategyQuant X owns native quantitative semantics</text>
  <text x="826" y="526" class="body">Builder/search/GA · native blocks · historical backtest · rankings/filters</text>
  <text x="826" y="552" class="body">Retester · robustness · optimization/Walk-Forward · Custom Project execution</text>
  <text x="826" y="588" class="small" fill="#c7b8ff">Missing seam = unavailable or integrate the producer. Never rebuild a substitute engine.</text>

  <!-- milestones -->
  <text x="70" y="688" class="eyebrow">ROADMAP THAT FUTURE AGENTS SHOULD FOLLOW</text>
  <g>
    <rect x="70" y="710" width="210" height="180" rx="14" fill="#101a28" stroke="#54667b"/>
    <circle cx="98" cy="742" r="11" fill="#75879a"/><text x="98" y="746" text-anchor="middle" font-size="10" font-weight="900" fill="#07101a">0</text><text x="119" y="748" class="milestone">Repository truth</text>
    <text x="94" y="782" class="small">PR / branch disposition</text><text x="94" y="807" class="small">docs agree with code</text><text x="94" y="832" class="small">main protected</text><text x="94" y="857" class="small">clean build + launch</text>

    <path d="M280 798 H305" stroke="#536b80" stroke-width="3"/>
    <rect x="305" y="710" width="225" height="180" rx="14" fill="#15203e" stroke="#6258c8"/>
    <circle cx="333" cy="742" r="11" fill="#7561ff"/><text x="333" y="746" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">1</text><text x="354" y="748" class="milestone">Research usable</text>
    <text x="329" y="782" class="small">real desktop workflow</text><text x="329" y="807" class="small">actionable specification</text><text x="329" y="832" class="small">Candidates / Backtest / Proof</text><text x="329" y="857" class="small">owner visual approval</text>

    <path d="M530 798 H555" stroke="#536b80" stroke-width="3"/>
    <rect x="555" y="710" width="225" height="180" rx="14" fill="#102a27" stroke="#3c8f79"/>
    <circle cx="583" cy="742" r="11" fill="#48d8a0"/><text x="583" y="746" text-anchor="middle" font-size="10" font-weight="900" fill="#07150f">2</text><text x="604" y="748" class="milestone">Daily personal use</text>
    <text x="579" y="782" class="small">meaningful launch screen</text><text x="579" y="807" class="small">recent work + recovery</text><text x="579" y="832" class="small">runtime setup / diagnostics</text><text x="579" y="857" class="small">settings + state management</text>

    <path d="M780 798 H805" stroke="#536b80" stroke-width="3"/>
    <rect x="805" y="710" width="210" height="180" rx="14" fill="#17261f" stroke="#607d55"/>
    <circle cx="833" cy="742" r="11" fill="#86b56f"/><text x="833" y="746" text-anchor="middle" font-size="10" font-weight="900" fill="#102010">3</text><text x="854" y="748" class="milestone">Live / Operate</text>
    <text x="829" y="782" class="small">current market authority</text><text x="829" y="807" class="small">signals + execution state</text><text x="829" y="832" class="small">risk + scoped performance</text><text x="829" y="857" class="small">promotion/deployment path</text>

    <path d="M1015 798 H1040" stroke="#536b80" stroke-width="3"/>
    <rect x="1040" y="710" width="220" height="180" rx="14" fill="#271e12" stroke="#8a6835"/>
    <circle cx="1068" cy="742" r="11" fill="#e5a94f"/><text x="1068" y="746" text-anchor="middle" font-size="10" font-weight="900" fill="#241507">4</text><text x="1089" y="748" class="milestone">Commercial readiness</text>
    <text x="1064" y="782" class="small">installer + signing + updater</text><text x="1064" y="807" class="small">auth / license / entitlement</text><text x="1064" y="832" class="small">migration / backup / support</text><text x="1064" y="857" class="small">security + release process</text>

    <path d="M1260 798 H1285" stroke="#536b80" stroke-width="3"/>
    <rect x="1285" y="710" width="245" height="180" rx="14" fill="#261727" stroke="#8b5b8c"/>
    <circle cx="1313" cy="742" r="11" fill="#cf73d2"/><text x="1313" y="746" text-anchor="middle" font-size="10" font-weight="900" fill="#2a0e2b">5</text><text x="1334" y="748" class="milestone">Public beta / release</text>
    <text x="1309" y="782" class="small">clean-machine install</text><text x="1309" y="807" class="small">first-run onboarding</text><text x="1309" y="832" class="small">upgrade + rollback</text><text x="1309" y="857" class="small">customer support runbook</text>
  </g>

  <rect x="70" y="918" width="1460" height="32" rx="8" fill="#101821"/>
  <text x="800" y="939" text-anchor="middle" class="small" fill="#c9d5e2">Definition of progress: the actual packaged desktop becomes more useful, more coherent, and closer to a product someone can buy.</text>
</svg>