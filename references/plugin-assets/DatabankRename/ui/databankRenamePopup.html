<!-- Modal window-->
<div class="modal modal-onefield" id="databankRenamePopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel"><tsq>Rename selected strategies</tsq> ({{count}})</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                    <div ng-show="count==1">
                        <label class="sqn-label">
                            <tsq>Name</tsq>
                            <input type="text" class="sqn-input" ng-model="config.name" />
                        </label>
                    </div>
                    
                    <div ng-show="count>1" class="flexed-row">
                        <label class="sqn-label">
                            <tsq>Prefix</tsq>
                        </label>
                        <input type="text" class="sqn-input" ng-model="config.prefix" />

                        <label class="sqn-label greyed"><tsq>Original</tsq></label>

                        <label class="sqn-label">
                            <tsq>Postfix</tsq>
                        </label>
                        <input type="text" class="sqn-input" ng-model="config.postfix" />
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="onRename()" tsq>Rename</button>
            </div>
        </div>
    </div>
</div>
