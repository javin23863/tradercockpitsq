name: PR48 corrupt archive normalization

on:
  push:
    branches:
      - codex/research-configuration-approval-ready

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-configuration-approval-ready
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize corrupt compressed Builder members
        shell: python
        run: |
          from pathlib import Path

          source = Path('product/tradercockpit/sqx_builder_config.py')
          text = source.read_text(encoding='utf-8')
          import_old = 'from pathlib import Path\nfrom typing import Iterable\n'
          import_new = 'from pathlib import Path\nfrom typing import Iterable\nimport zlib\n'
          if text.count(import_old) != 1:
              raise SystemExit('expected one sqx_builder_config import target')
          text = text.replace(import_old, import_new, 1)
          except_old = 'except (BadZipFile, RuntimeError, NotImplementedError, OSError) as exc:'
          except_new = 'except (BadZipFile, RuntimeError, NotImplementedError, OSError, EOFError, zlib.error) as exc:'
          if text.count(except_old) != 1:
              raise SystemExit('expected one archive normalization target')
          source.write_text(text.replace(except_old, except_new, 1), encoding='utf-8')

          tests = Path('tests/product/test_sqx_builder_archive_failures.py')
          text = tests.read_text(encoding='utf-8')
          test_import_old = 'from tempfile import TemporaryDirectory\nimport unittest\n'
          test_import_new = 'from tempfile import TemporaryDirectory\nimport unittest\nimport zlib\n'
          if text.count(test_import_old) != 1:
              raise SystemExit('expected one test import target')
          text = text.replace(test_import_old, test_import_new, 1)
          marker = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          if text.count(marker) != 1:
              raise SystemExit('expected one test insertion marker')
          additions = '''

    def test_initial_corrupt_deflate_failure_is_normalized(self) -> None:
        with TemporaryDirectory() as tmp:
            root = Path(tmp)
            self._runtime(root)
            with (
                patch("tradercockpit.sqx_builder_config.verified_sqx_home", return_value=root),
                patch("tradercockpit.sqx_builder_config.ZipFile.read", side_effect=zlib.error("corrupt deflate stream")),
            ):
                with self.assertRaises(SqxBuilderConfigError) as caught:
                    read_sqx_builder_project(root)
            self.assertEqual(caught.exception.code, "builder_project_archive_invalid")

    def test_initial_truncated_member_failure_is_normalized(self) -> None:
        with TemporaryDirectory() as tmp:
            root = Path(tmp)
            self._runtime(root)
            with (
                patch("tradercockpit.sqx_builder_config.verified_sqx_home", return_value=root),
                patch("tradercockpit.sqx_builder_config.ZipFile.read", side_effect=EOFError("truncated compressed member")),
            ):
                with self.assertRaises(SqxBuilderConfigError) as caught:
                    read_sqx_builder_project(root)
            self.assertEqual(caught.exception.code, "builder_project_archive_invalid")
'''
          tests.write_text(text.replace(marker, additions + marker, 1), encoding='utf-8')
      - name: Focused configuration tests
        run: PYTHONPATH=product python -m unittest tests.product.test_sqx_builder_config tests.product.test_sqx_builder_archive_failures tests.product.test_research_configuration_review_fixes
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tradercockpit/sqx_builder_config.py tests/product/test_sqx_builder_archive_failures.py
          git commit -m "fix: normalize corrupt Builder archive members"
          git push origin HEAD:codex/research-configuration-approval-ready
