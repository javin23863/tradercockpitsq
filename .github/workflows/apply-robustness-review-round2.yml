name: Apply Robustness Review Round Two

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - .github/workflows/apply-robustness-review-round2.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production package
        run: python -m pip install -e .
      - name: Apply five Codex corrections
        run: python .github/scripts/apply_robustness_review_round2.py
      - name: Python syntax
        run: |
          python -m py_compile product/tradercockpit/research_robustness.py product/tradercockpit/research_retester_http.py product/tradercockpit/sqx_gateway.py
      - name: Focused product regressions
        run: |
          python -m unittest \
            tests.product.test_research_robustness \
            tests.product.test_research_robustness_http_boundary \
            tests.product.test_sqx_retester_gateway
      - name: Focused frontend regressions
        run: |
          node --check web/research-backtest-robustness.mjs
          node --test tests/research-backtest-robustness.test.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit corrected tree
        run: |
          rm .github/scripts/apply_robustness_review_round2.py
          rm .github/workflows/apply-robustness-review-round2.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden robustness proof and readback custody"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
