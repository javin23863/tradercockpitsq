name: Finalize Robustness Review

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - ".github/workflows/finalize-robustness-review.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Apply final hardening and obsolete-script cleanup
        run: python .github/scripts/finalize_robustness_review.py
      - name: Python syntax
        run: python -m py_compile product/tradercockpit/research_robustness.py product/tradercockpit/research_retester_http.py product/tradercockpit/sqx_gateway.py
      - name: Focused robustness and gateway suite
        run: python -m unittest tests.product.test_sqx_retester_gateway tests.product.test_research_robustness tests.product.test_research_robustness_http_boundary -v
      - name: Full product suite
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - name: Frontend syntax and UI suite
        run: |
          node --check web/research-backtest-robustness.mjs
          node --check tests/research-backtest-robustness.test.mjs
          npm test
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Remove generated test artifacts
        shell: bash
        run: |
          find product tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf product/tradercockpit_core.egg-info
      - name: Diff scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(\.github/(patches/apply_robustness_review_round3.py|scripts/apply_robustness_review_round4.py|workflows/(apply-robustness-review-round3.yml|fix-finalize-robustness-script.yml))|product/tradercockpit/(research_robustness.py|research_retester_http.py)|tests/product/(test_research_robustness.py|test_research_robustness_http_boundary.py)|tests/research-backtest-robustness.test.mjs|web/research-backtest-robustness.mjs)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit final hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden robustness readback custody before merge"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
