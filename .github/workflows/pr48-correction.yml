name: PR48 bounded correction

on:
  push:
    branches:
      - codex/research-configuration-approval-ready

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-configuration-approval-ready
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact review corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "product/tradercockpit/sqx_builder_config.py",
              '''    except BadZipFile as exc:\n        raise SqxBuilderConfigError(\n            "builder_project_archive_invalid",\n            "SQX Builder project.cfx is not a readable native project archive",\n        ) from exc\n''',
              '''    except (BadZipFile, RuntimeError, NotImplementedError, OSError) as exc:\n        raise SqxBuilderConfigError(\n            "builder_project_archive_invalid",\n            "SQX Builder project.cfx is not a readable native project archive",\n        ) from exc\n''',
          )

          replace_once(
              "product/tradercockpit/research_configurations.py",
              '''import json\nimport re\nfrom uuid import UUID\n''',
              '''import json\nimport os\nimport re\nfrom uuid import UUID\n''',
          )
          replace_once(
              "product/tradercockpit/research_configurations.py",
              '''def _exact_native_task_snapshot(config: SqxBuilderProjectConfig) -> tuple[bytes, bytes]:\n    try:\n        archive_snapshot = config.archive_path.read_bytes()\n    except OSError as exc:\n        raise ResearchConfigurationError("configuration_source_unreadable", "Builder project snapshot could not be read") from exc\n    observed_sha = sha256(archive_snapshot).hexdigest()\n    if observed_sha != config.archive_sha256:\n        raise ResearchConfigurationError(\n            "configuration_source_moved",\n            "Builder project changed between configuration inspection and assembly",\n        )\n    return archive_snapshot, _archive_task_snapshot(archive_snapshot)\n''',
              '''def _exact_native_task_snapshot(\n    config: SqxBuilderProjectConfig,\n    sqx_home,\n) -> tuple[bytes, bytes]:\n    try:\n        resolved_before = config.archive_path.resolve(strict=True)\n        with resolved_before.open("rb") as handle:\n            opened_stat = os.fstat(handle.fileno())\n            archive_snapshot = handle.read()\n    except (OSError, RuntimeError, ValueError) as exc:\n        raise ResearchConfigurationError(\n            "configuration_source_unreadable",\n            "Builder project snapshot could not be read from the inspected physical path",\n        ) from exc\n\n    home = verified_sqx_home(sqx_home)\n    try:\n        expected = (home / SQX_BUILDER_PROJECT_RELATIVE_PATH).resolve(strict=True)\n        expected.relative_to(home)\n        resolved_after = config.archive_path.resolve(strict=True)\n        path_stat = resolved_after.stat()\n    except (OSError, RuntimeError, ValueError) as exc:\n        raise ResearchConfigurationError(\n            "configuration_source_moved",\n            "Builder project physical path changed during configuration assembly",\n        ) from exc\n\n    if (\n        resolved_before != resolved_after\n        or resolved_after != expected\n        or (opened_stat.st_dev, opened_stat.st_ino) != (path_stat.st_dev, path_stat.st_ino)\n    ):\n        raise ResearchConfigurationError(\n            "configuration_source_moved",\n            "Builder project no longer matches the exact verified in-runtime physical path",\n        )\n\n    observed_sha = sha256(archive_snapshot).hexdigest()\n    if observed_sha != config.archive_sha256:\n        raise ResearchConfigurationError(\n            "configuration_source_moved",\n            "Builder project changed between configuration inspection and assembly",\n        )\n    return archive_snapshot, _archive_task_snapshot(archive_snapshot)\n''',
          )
          replace_once(
              "product/tradercockpit/research_configurations.py",
              '''    config = read_sqx_builder_project(sqx_home)\n    archive_snapshot, task_snapshot = _exact_native_task_snapshot(config)\n    verified_sqx_home(sqx_home)\n''',
              '''    config = read_sqx_builder_project(sqx_home)\n    archive_snapshot, task_snapshot = _exact_native_task_snapshot(config, sqx_home)\n    verified_sqx_home(sqx_home)\n''',
          )

          replace_once(
              "web/research-build.mjs",
              '''const RESEARCH_CONFIGURATIONS_API_PATH = "/api/research/configurations";\n''',
              '''const RESEARCH_CONFIGURATIONS_API_PATH = "/api/research/configurations";\nconst CONFIGURATION_ROUTE_PARAM = "configuration";\n''',
          )
          replace_once(
              "web/research-build.mjs",
              '''export function configurationSelectionTarget(catalog, preferredEntityId = "", selectedEntityId = "") {\n  if (preferredEntityId) return preferredEntityId;\n  if (selectedEntityId) return selectedEntityId;\n  return catalog.length === 1 ? catalog[0].entity_id : "";\n}\n''',
              '''function catalogContainsEntity(catalog, entityId) {\n  return Boolean(entityId) && catalog.some((item) => item.entity_id === entityId);\n}\n\nexport function configurationRouteEntity(locationLike = globalThis.location) {\n  const params = new URLSearchParams(locationLike?.search || "");\n  return params.get(CONFIGURATION_ROUTE_PARAM) || "";\n}\n\nexport function configurationRouteSearch(entityId, locationLike = globalThis.location) {\n  const params = new URLSearchParams(locationLike?.search || "");\n  if (entityId) params.set(CONFIGURATION_ROUTE_PARAM, entityId);\n  else params.delete(CONFIGURATION_ROUTE_PARAM);\n  const query = params.toString();\n  return query ? `?${query}` : "";\n}\n\nfunction persistConfigurationRoute(entityId) {\n  if (!globalThis.history?.replaceState || !globalThis.location) return;\n  const search = configurationRouteSearch(entityId, globalThis.location);\n  const pathname = globalThis.location.pathname || "/research";\n  const hash = globalThis.location.hash || "";\n  globalThis.history.replaceState(globalThis.history.state, "", `${pathname}${search}${hash}`);\n}\n\nexport function configurationSelectionTarget(\n  catalog,\n  preferredEntityId = "",\n  selectedEntityId = "",\n  routeEntityId = "",\n) {\n  for (const candidate of [preferredEntityId, selectedEntityId, routeEntityId]) {\n    if (catalogContainsEntity(catalog, candidate)) return candidate;\n  }\n  return catalog.length === 1 ? catalog[0].entity_id : "";\n}\n''',
          )
          replace_once(
              "web/research-build.mjs",
              '''    const catalogPayload = await fetchConfigurationCatalog();\n    const catalog = Object.freeze([...catalogPayload.configurations]);\n    const target = configurationSelectionTarget(catalog, preferredEntityId, selectedEntityId);\n    const selected = target ? await fetchConfiguration(target) : null;\n    buildState = Object.freeze({ phase: "loaded", catalog, selected, detail: "" });\n''',
              '''    const catalogPayload = await fetchConfigurationCatalog();\n    const catalog = Object.freeze([...catalogPayload.configurations]);\n    const routeEntityId = configurationRouteEntity();\n    const target = configurationSelectionTarget(catalog, preferredEntityId, selectedEntityId, routeEntityId);\n    const selected = target ? await fetchConfiguration(target) : null;\n    persistConfigurationRoute(selected?.entity_id || "");\n    buildState = Object.freeze({ phase: "loaded", catalog, selected, detail: "" });\n''',
          )
          replace_once(
              "web/research-build.mjs",
              '''  buildState = Object.freeze({ ...buildState, phase: "loading", detail: "Compiling exact native snapshot…" });\n''',
              '''  buildState = Object.freeze({ ...buildState, phase: "loading", selected: null, detail: "Compiling exact native snapshot…" });\n''',
          )
          replace_once(
              "web/research-build.mjs",
              '''  buildState = Object.freeze({ ...buildState, phase: "loading", detail: "Approving exact revision…" });\n''',
              '''  buildState = Object.freeze({ ...buildState, phase: "loading", selected: null, detail: "Approving exact revision…" });\n''',
          )
          replace_once(
              "web/research-build.mjs",
              '''async function selectConfiguration(entityId) {\n  buildState = Object.freeze({ ...buildState, phase: "loading", detail: "Loading saved configuration…" });\n  renderBoundRoot();\n  try {\n    const selected = await fetchConfiguration(entityId);\n    buildState = Object.freeze({ ...buildState, phase: "loaded", selected, detail: "" });\n''',
              '''async function selectConfiguration(entityId) {\n  buildState = Object.freeze({ ...buildState, phase: "loading", selected: null, detail: "Loading saved configuration…" });\n  renderBoundRoot();\n  try {\n    const selected = await fetchConfiguration(entityId);\n    persistConfigurationRoute(selected.entity_id);\n    buildState = Object.freeze({ ...buildState, phase: "loaded", selected, detail: "" });\n''',
          )

          Path("tests/research-build-route-selection.test.mjs").write_text(r'''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport {\n  configurationRouteEntity,\n  configurationRouteSearch,\n  configurationSelectionTarget,\n} from "../web/research-build.mjs";\n\nconst first = { entity_id: "first" };\nconst second = { entity_id: "second" };\n\ntest("route identity restores the exact selected configuration among multiple entities", () => {\n  assert.equal(\n    configurationSelectionTarget([first, second], "", "", "second"),\n    "second",\n  );\n  assert.equal(\n    configurationSelectionTarget([first, second], "", "", "missing"),\n    "",\n  );\n});\n\ntest("configuration route identity round-trips without disturbing Build route state", () => {\n  const location = { search: "?stage=construct&tab=build" };\n  const search = configurationRouteSearch("tc-research:configuration:v1:abc", location);\n  assert.equal(\n    configurationRouteEntity({ search }),\n    "tc-research:configuration:v1:abc",\n  );\n  const params = new URLSearchParams(search);\n  assert.equal(params.get("stage"), "construct");\n  assert.equal(params.get("tab"), "build");\n});\n\ntest("preferred and in-memory identities win only when still present in catalog", () => {\n  assert.equal(configurationSelectionTarget([first, second], "missing", "second", "first"), "second");\n  assert.equal(configurationSelectionTarget([first], "missing", "missing", "missing"), "first");\n});\n'''.replace('\\n', '\n'), encoding="utf-8")

          Path("tests/product/test_sqx_builder_archive_failures.py").write_text('''from __future__ import annotations\n\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\nimport unittest\nfrom unittest.mock import patch\nfrom zipfile import ZipFile\n\nfrom tradercockpit.sqx_builder_config import (\n    SQX_BUILDER_PROJECT_RELATIVE_PATH,\n    SqxBuilderConfigError,\n    read_sqx_builder_project,\n)\n\n\nclass SqxBuilderArchiveFailureTests(unittest.TestCase):\n    def _runtime(self, root: Path) -> Path:\n        project = root / SQX_BUILDER_PROJECT_RELATIVE_PATH\n        project.parent.mkdir(parents=True)\n        with ZipFile(project, "w") as archive:\n            archive.writestr("config.xml", b"<Project><Chart symbol='EURUSD' timeframe='H1'/><InstrumentInfo instrument='EURUSD'/></Project>")\n            archive.writestr("Build-Task1.xml", b"<BuildTask><Chart symbol='EURUSD' timeframe='H1'/><InstrumentInfo instrument='EURUSD'/></BuildTask>")\n        return project\n\n    def test_initial_encrypted_member_failure_is_normalized(self) -> None:\n        with TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            self._runtime(root)\n            with (\n                patch("tradercockpit.sqx_builder_config.verified_sqx_home", return_value=root),\n                patch("tradercockpit.sqx_builder_config.ZipFile.read", side_effect=RuntimeError("encrypted")),\n            ):\n                with self.assertRaises(SqxBuilderConfigError) as caught:\n                    read_sqx_builder_project(root)\n            self.assertEqual(caught.exception.code, "builder_project_archive_invalid")\n\n    def test_initial_unsupported_compression_failure_is_normalized(self) -> None:\n        with TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            self._runtime(root)\n            with (\n                patch("tradercockpit.sqx_builder_config.verified_sqx_home", return_value=root),\n                patch("tradercockpit.sqx_builder_config.ZipFile.read", side_effect=NotImplementedError("compression")),\n            ):\n                with self.assertRaises(SqxBuilderConfigError) as caught:\n                    read_sqx_builder_project(root)\n            self.assertEqual(caught.exception.code, "builder_project_archive_invalid")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
      - name: Focused product tests
        run: PYTHONPATH=product python -m unittest tests.product.test_research_configuration_review_fixes tests.product.test_research_configurations tests.product.test_sqx_builder_archive_failures
      - name: Focused frontend tests
        run: node --test tests/research-build-review-fixes.test.mjs tests/research-build-route-selection.test.mjs tests/research-build-ui.test.mjs
      - name: Commit bounded corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tradercockpit/sqx_builder_config.py product/tradercockpit/research_configurations.py web/research-build.mjs tests/research-build-route-selection.test.mjs tests/product/test_sqx_builder_archive_failures.py
          git commit -m "fix: close configuration custody review gaps"
          git push origin HEAD:codex/research-configuration-approval-ready
