name: Fix User Proof Catalog Fail Closed

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - ".github/scripts/fix_user_proof_catalog_fail_closed.py"
      - ".github/workflows/fix-user-proof-catalog-fail-closed.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vertical-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply user Proof catalog fail-closed correction
        run: python .github/scripts/fix_user_proof_catalog_fail_closed.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Run focused Proof and Robustness regressions
        run: |
          python -m unittest tests.product.test_research_proof tests.product.test_research_proof_http -v
          python -m unittest tests.product.test_research_robustness.ResearchRobustnessTests.test_catalog_ignores_registered_user_research_proof_schema tests.product.test_research_robustness.ResearchRobustnessTests.test_unrecognized_current_proof_schema_fails_catalog_closed -v
      - name: Remove temporary correction machinery
        run: rm .github/scripts/fix_user_proof_catalog_fail_closed.py .github/workflows/fix-user-proof-catalog-fail-closed.yml
      - name: Commit correction
        run: |
          git config user.name "javin23863"
          git config user.email "joshuajacob2386@gmail.com"
          git add product/tradercockpit/research_proof.py tests/product/test_research_proof.py .github/scripts/fix_user_proof_catalog_fail_closed.py .github/workflows/fix-user-proof-catalog-fail-closed.yml
          git commit -m "Fail closed on unknown user Proof schemas"
          git push origin HEAD:research/vertical-completion
