name: Clean Robustness Generated Artifacts

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - name: Remove generated artifacts and self
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm -r product/tradercockpit/__pycache__ product/tradercockpit_core.egg-info tests/product/__pycache__
          git rm .github/workflows/cleanup-robustness-generated.yml
          git commit -m "Remove generated robustness review artifacts"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
