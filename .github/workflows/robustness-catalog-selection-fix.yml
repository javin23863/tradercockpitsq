name: Apply Robustness Catalog Selection Fix

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selection correction
        run: python tools/apply_robustness_catalog_selection_fix.py
      - name: Focused frontend acceptance
        run: |
          node --check web/research-backtest-robustness.mjs
          node --test tests/research-backtest-robustness.test.mjs
      - name: Commit corrected exact head
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add web/research-backtest-robustness.mjs tests/research-backtest-robustness.test.mjs
          git rm .github/workflows/robustness-catalog-selection-fix.yml tools/apply_robustness_catalog_selection_fix.py
          git commit -m "Bind robustness catalog readback to selected history"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
