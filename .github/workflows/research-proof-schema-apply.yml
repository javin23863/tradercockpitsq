name: Research Proof Schema Apply

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - .github/scripts/apply_research_proof_schema.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Proof schema correction
        run: python .github/scripts/apply_research_proof_schema.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Proof backend and frontend tests
        run: |
          python -m unittest tests.product.test_research_proof tests.product.test_research_proof_http -v
          node --check web/research-proof.mjs
          npm test
      - name: Commit Proof schema correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tradercockpit/research_proof.py
          git diff --cached --quiet && exit 0
          git commit -m "Bind canonical Idea schema in Research Proof"
          git push origin HEAD:research/vertical-completion
