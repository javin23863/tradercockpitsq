name: Apply Robustness Review Round Six

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - ".github/workflows/apply-robustness-review-round6.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Verify exact product base under shallow checkout
        shell: bash
        run: |
          set -euo pipefail
          expected=a752a58d73be0bd6622b888fc96a84a761c92313
          git fetch --no-tags --depth=1 origin "$expected"
          unexpected=$(git diff --name-only "$expected" HEAD | grep -Ev '^(\.github/scripts/apply_robustness_review_round6.py|\.github/workflows/apply-robustness-review-round6.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Product tree moved before correction:"
            echo "$unexpected"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_robustness_review_round6.py')
          text = path.read_text(encoding='utf-8')
          old = '''base = subprocess.check_output(["git", "rev-parse", "HEAD~2"], text=True).strip()\nif base != EXPECTED_PRODUCT_HEAD:\n    raise SystemExit(f"unexpected product base {base}; expected {EXPECTED_PRODUCT_HEAD}")\n'''
          if text.count(old) != 1:
              raise SystemExit('round-six base guard shape changed')
          path.write_text(text.replace(old, 'base = EXPECTED_PRODUCT_HEAD\n', 1), encoding='utf-8')
          PY
      - name: Apply exact sixth-round corrections
        run: python .github/scripts/apply_robustness_review_round6.py
      - name: Python syntax
        run: python -m py_compile product/tradercockpit/research_robustness.py product/tradercockpit/research_retester_http.py product/tradercockpit/sqx_gateway.py tests/product/test_research_robustness.py tests/product/test_research_robustness_http_boundary.py tests/product/test_sqx_retester_gateway.py
      - name: Focused sixth-round regressions
        run: python -m unittest tests.product.test_research_robustness tests.product.test_research_robustness_http_boundary tests.product.test_sqx_retester_gateway -v
      - name: Full product suite
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - name: Frontend syntax and UI suite
        run: |
          node --check web/research-backtest-robustness.mjs
          node --check tests/research-backtest-robustness.test.mjs
          npm test
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Remove temporary correction artifacts and generated files
        shell: bash
        run: |
          rm -f .github/scripts/apply_robustness_review_round6.py .github/workflows/apply-robustness-review-round6.yml
          find product tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf product/tradercockpit_core.egg-info
      - name: Diff scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(\.github/(scripts/apply_robustness_review_round6.py|workflows/apply-robustness-review-round6.yml)|product/tradercockpit/(research_robustness.py|research_retester_http.py|sqx_gateway.py)|tests/product/(test_research_robustness.py|test_research_robustness_http_boundary.py|test_sqx_retester_gateway.py)|tests/research-backtest-robustness.test.mjs|web/research-backtest-robustness.mjs)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve sixth-round robustness review findings"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
