name: Fix Robustness Archive Fixture

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - ".github/scripts/fix_robustness_archive_fixture.py"
      - ".github/workflows/fix-robustness-archive-fixture.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vertical-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic fixture correction
        run: python .github/scripts/fix_robustness_archive_fixture.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Run focused regression
        run: python -m unittest tests.product.test_research_robustness.ResearchRobustnessTests.test_completion_custody_failure_persists_failed_proof_after_native_execution -v
      - name: Remove temporary correction machinery
        run: rm .github/scripts/fix_robustness_archive_fixture.py .github/workflows/fix-robustness-archive-fixture.yml
      - name: Commit correction
        run: |
          git config user.name "javin23863"
          git config user.email "joshuajacob2386@gmail.com"
          git add tests/product/test_research_robustness.py .github/scripts/fix_robustness_archive_fixture.py .github/workflows/fix-robustness-archive-fixture.yml
          git commit -m "Make robustness archive fixture deterministic"
          git push origin HEAD:research/vertical-completion
