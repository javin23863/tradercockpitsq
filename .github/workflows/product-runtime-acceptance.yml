name: Product Runtime Acceptance

on:
  push:
    branches:
      - codex/product-runtime-core
      - codex/product-ui-integration
      - codex/repo-consolidation
  pull_request:
    paths:
      - "product/**"
      - "tests/product/**"
      - "tools/check_production_boundary.py"
      - "pyproject.toml"
      - "web/**"
      - "tests/*.mjs"
      - "package.json"
      - ".github/workflows/product-runtime-acceptance.yml"

jobs:
  product-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Product tests
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax checks
        run: |
          node --check web/app.mjs
          node --check web/model.mjs
          node --check web/run-read.mjs
          node --check tests/ui-shell.test.mjs
          node --check tests/run-read.test.mjs
          node --check tests/browser-regression.mjs
          node --check tests/run-browser-regression.mjs
      - name: UI and run-read tests
        run: npm test
      - name: Install browser acceptance tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start TraderCockpit server
        run: |
          python -m tradercockpit.app_server --host 127.0.0.1 --port 4173 > /tmp/tradercockpit-server.log 2>&1 &
          echo $! > /tmp/tradercockpit-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/cockpit > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tradercockpit-server.log
          exit 1
      - name: Browser regression
        run: node tests/run-browser-regression.mjs
      - name: Stop TraderCockpit server
        if: always()
        run: |
          if [ -f /tmp/tradercockpit-server.pid ]; then
            kill "$(cat /tmp/tradercockpit-server.pid)" || true
          fi
          cat /tmp/tradercockpit-server.log || true
