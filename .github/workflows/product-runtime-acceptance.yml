name: Product Runtime Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "product/**"
      - "tests/product/**"
      - "tools/check_production_boundary.py"
      - "pyproject.toml"
      - "web/**"
      - "tests/*.mjs"
      - "package.json"
      - ".github/workflows/product-runtime-acceptance.yml"

jobs:
  product-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Product tests
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax checks
        run: |
          node --check web/app.mjs
          node --check web/model.mjs
          node --check web/candidates-authority.mjs
          node --check web/run-read.mjs
          node --check web/sqx-presets.mjs
          node --check web/sqx-outputs.mjs
          node --check tests/ui-shell.test.mjs
          node --check tests/candidates-authority.test.mjs
          node --check tests/run-read.test.mjs
          node --check tests/sqx-presets.test.mjs
          node --check tests/sqx-outputs.test.mjs
          node --check tests/browser-regression.mjs
          node --check tests/run-browser-regression.mjs
          node --check tests/run-builder-candidates-browser.mjs
          node --check tests/run-sqx-presets-browser.mjs
          node --check tests/run-sqx-outputs-browser.mjs
      - name: UI and run-read tests
        run: npm test
      - name: Install browser acceptance tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Builder Candidates integration server
        run: |
          rm -rf /tmp/tc-builder-browser-state
          python tests/builder-browser-server.py --host 127.0.0.1 --port 4175 --state-root /tmp/tc-builder-browser-state > /tmp/tradercockpit-builder-server.log 2>&1 &
          echo $! > /tmp/tradercockpit-builder-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4175/api/builder-candidates?strategyRef=probe" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tradercockpit-builder-server.log
          exit 1
      - name: Builder Candidates browser integration
        run: node tests/run-builder-candidates-browser.mjs
      - name: Start TraderCockpit server
        run: |
          python -m tradercockpit.app_server --host 127.0.0.1 --port 4173 > /tmp/tradercockpit-server.log 2>&1 &
          echo $! > /tmp/tradercockpit-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/cockpit > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tradercockpit-server.log
          exit 1
      - name: Browser regression
        run: node tests/run-browser-regression.mjs
      - name: SQX preset browser integration
        run: node tests/run-sqx-presets-browser.mjs
      - name: Prepare SQX output custody fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          home = Path('/tmp/sqx-output-fixture')
          results = home / 'user/projects/Builder/databanks/Results'
          (home / 'internal/web/SQUANT').mkdir(parents=True, exist_ok=True)
          (home / 'internal').mkdir(parents=True, exist_ok=True)
          results.mkdir(parents=True, exist_ok=True)
          (home / 'internal/web/SQUANT/build.dat').write_text('2953', encoding='utf-8')
          (home / 'internal/SQUANT.dat').write_bytes(b'144')
          with ZipFile(results / 'Generated Browser.sqx', 'w') as archive:
              archive.writestr('settings.xml', b'<Settings><Symbol>ES</Symbol></Settings>')
              archive.writestr('strategy_Portfolio.xml', b'<Strategy><Rule>native-sqx</Rule></Strategy>')
              archive.writestr('version.txt', b'144.2953')
              archive.writestr('orders.bin', b'native orders')
          Path('/tmp/tc-output-state').mkdir(parents=True, exist_ok=True)
          PY
      - name: Start SQX output custody server
        run: |
          python -m tradercockpit.app_server --host 127.0.0.1 --port 4174 --sqx-home /tmp/sqx-output-fixture --state-root /tmp/tc-output-state > /tmp/tradercockpit-output-server.log 2>&1 &
          echo $! > /tmp/tradercockpit-output-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/api/sqx-outputs > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tradercockpit-output-server.log
          exit 1
      - name: SQX output custody browser integration
        run: node tests/run-sqx-outputs-browser.mjs
      - name: Stop TraderCockpit servers
        if: always()
        run: |
          if [ -f /tmp/tradercockpit-builder-server.pid ]; then
            kill "$(cat /tmp/tradercockpit-builder-server.pid)" || true
          fi
          if [ -f /tmp/tradercockpit-server.pid ]; then
            kill "$(cat /tmp/tradercockpit-server.pid)" || true
          fi
          if [ -f /tmp/tradercockpit-output-server.pid ]; then
            kill "$(cat /tmp/tradercockpit-output-server.pid)" || true
          fi
          cat /tmp/tradercockpit-builder-server.log || true
          cat /tmp/tradercockpit-server.log || true
          cat /tmp/tradercockpit-output-server.log || true
