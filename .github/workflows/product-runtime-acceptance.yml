name: Product Runtime Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "product/**"
      - "tests/product/**"
      - "tools/build_windows_desktop.py"
      - "tools/install_windows_desktop.py"
      - "tools/check_production_boundary.py"
      - "pyproject.toml"
      - "web/**"
      - "tests/*.mjs"
      - "package.json"
      - ".github/workflows/product-runtime-acceptance.yml"

jobs:
  product-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Product tests including desktop lifecycle
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax checks
        run: |
          node --check web/app.mjs
          node --check web/model.mjs
          node --check web/research-ideas.mjs
          node --check web/research-capabilities.mjs
          node --check web/research-builder-config-snapshot.mjs
          node --check web/research-native-inspector-tools.mjs
          node --check web/research-backtest-robustness.mjs
          node --check web/research-proof.mjs
          node --check web/window-title.mjs
          node --check tests/ui-shell.test.mjs
          node --check tests/research-ideas-ui.test.mjs
          node --check tests/research-capabilities.test.mjs
          node --check tests/research-builder-config-snapshot.test.mjs
          node --check tests/research-native-inspector-tools.test.mjs
          node --check tests/research-backtest-robustness.test.mjs
          node --check tests/research-proof.test.mjs
          node --check tests/window-title.test.mjs
          node --check tests/browser-regression.mjs
          node --check tests/research-vertical-browser-regression.mjs
          node --check tests/run-browser-regression.mjs
          node --check tests/run-browser-robustness-regression.mjs
          node --check tests/run-browser-proof-regression.mjs
      - name: UI tests
        run: npm test
      - name: Install browser acceptance tooling
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start canonical TraderCockpit server
        run: |
          rm -rf /tmp/tradercockpit-acceptance-data
          TRADERCOCKPIT_DATA_ROOT=/tmp/tradercockpit-acceptance-data python -m tradercockpit.app_server --host 127.0.0.1 --port 4173 > /tmp/tradercockpit-server.log 2>&1 &
          echo $! > /tmp/tradercockpit-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/home > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tradercockpit-server.log
          exit 1
      - name: Canonical product and Research vertical browser regression
        run: node tests/run-browser-regression.mjs
      - name: Backtest Robustness browser acceptance
        run: node tests/run-browser-robustness-regression.mjs
      - name: Research Proof restart browser acceptance
        run: node tests/run-browser-proof-regression.mjs
      - name: Stop TraderCockpit server
        if: always()
        run: |
          if [ -f /tmp/tradercockpit-server.pid ]; then
            kill "$(cat /tmp/tradercockpit-server.pid)" || true
          fi
          cat /tmp/tradercockpit-server.log || true

  windows-desktop-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows desktop and packaging dependencies
        run: python -m pip install -e ".[desktop,desktop-build]"
      - name: Desktop and packaging contract tests
        run: |
          python -m unittest discover -s tests/product -p 'test_desktop*.py' -v
          python -m unittest discover -s tests/product -p 'test_windows_packaging.py' -v
          python -m unittest discover -s tests/product -p 'test_windows_install.py' -v
          python -m unittest discover -s tests/product -p 'test_native_runtime_http.py' -v
      - name: Build frozen Windows desktop
        run: python tools/build_windows_desktop.py
      - name: Launch Home, reopen custody, and review packaged Research WebView2 desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "dist/windows/TraderCockpit.exe").Path
          $dataRoot = Join-Path $env:RUNNER_TEMP "tradercockpit-package-data"
          Remove-Item -Recurse -Force $dataRoot -ErrorAction SilentlyContinue
          $started = Start-Process -FilePath $exe -ArgumentList @("--port", "4174", "--start-path", "/home", "--data-root", $dataRoot) -PassThru
          try {
            $ready = $false
            $windowProcess = $null
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              $processes = @(Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue)
              if ($processes.Count -eq 0) {
                throw "Packaged TraderCockpit exited before desktop readiness"
              }

              $response = $null
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4174/home" -TimeoutSec 2
              } catch {
                $response = $null
              }
              $sqx = @(Get-Process -Name "StrategyQuantX","StrategyQuantX_ui","sqcli" -ErrorAction SilentlyContinue)
              if ($sqx.Count -gt 0) {
                throw "Packaged TraderCockpit launched StrategyQuant X during ordinary startup"
              }
              $window = $processes | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
              if (
                $null -ne $response -and
                $response.StatusCode -eq 200 -and
                $response.Content -match "<title>TraderCockpit</title>" -and
                $response.Content -match 'src="/app.mjs"' -and
                $null -ne $window -and
                $window.MainWindowTitle -eq "TraderCockpit"
              ) {
                $ready = $true
                $windowProcess = $window
                break
              }
            }
            if (-not $ready -or $null -eq $windowProcess) {
              throw "Packaged TraderCockpit did not expose the canonical Home UI in a Windows desktop window"
            }

            $ideaBody = @{ text = "Packaged desktop persistence probe"; source = "Product Runtime Acceptance" } | ConvertTo-Json -Compress
            $created = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:4174/api/research/ideas" -ContentType "application/json" -Body $ideaBody
            if ($created.schema -ne "tc.research-idea.v1") {
              throw "Packaged TraderCockpit did not persist an Idea through the canonical API"
            }

            Start-Sleep -Seconds 2
            $windowProcess.Refresh()
            if ($windowProcess.HasExited -or $windowProcess.MainWindowHandle -eq 0) {
              throw "Packaged TraderCockpit WebView2 window did not remain alive"
            }
            if (-not $windowProcess.CloseMainWindow()) {
              throw "Packaged TraderCockpit window refused graceful close"
            }

            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $remaining = @(Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue)
            } while ($remaining.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($remaining.Count -gt 0) {
              throw "Packaged TraderCockpit processes survived graceful window close"
            }

            $serverStillAlive = $false
            try {
              $null = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4174/home" -TimeoutSec 2
              $serverStillAlive = $true
            } catch {
              $serverStillAlive = $false
            }
            if ($serverStillAlive) {
              throw "Packaged TraderCockpit loopback server survived graceful window close"
            }

            $restarted = Start-Process -FilePath $exe -ArgumentList @("--port", "4174", "--start-path", "/home", "--data-root", $dataRoot) -PassThru
            try {
              $catalog = $null
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                Start-Sleep -Milliseconds 500
                try {
                  $catalog = Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:4174/api/research/ideas" -TimeoutSec 2
                } catch {
                  $catalog = $null
                }
                if ($null -ne $catalog) { break }
              }
              if ($null -eq $catalog -or $catalog.schema -ne "tc.research-idea-catalog.v1" -or @($catalog.ideas).Count -ne 1) {
                throw "Packaged TraderCockpit did not reopen persisted Idea custody"
              }
              if ($catalog.ideas[0].entity_id -ne $created.entity_id -or $catalog.ideas[0].revision -ne $created.revision) {
                throw "Packaged TraderCockpit reopened a different Idea identity or revision"
              }
            } finally {
              Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue | Stop-Process -Force
            }

            Start-Sleep -Seconds 1
            $researchStarted = Start-Process -FilePath $exe -ArgumentList @("--port", "4174", "--start-path", "/research", "--data-root", $dataRoot) -PassThru
            try {
              $researchReady = $false
              $researchWindow = $null
              $researchCatalog = $null
              $advertPath = Join-Path $dataRoot "desktop-loopback.json"
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                Start-Sleep -Milliseconds 500
                $processes = @(Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue)
                if ($processes.Count -eq 0) {
                  throw "Packaged TraderCockpit exited before Research desktop readiness"
                }
                $response = $null
                try {
                  $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4174/research" -TimeoutSec 2
                  $researchCatalog = Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:4174/api/research/ideas" -TimeoutSec 2
                } catch {
                  $response = $null
                  $researchCatalog = $null
                }
                $advert = $null
                if (Test-Path $advertPath) {
                  try { $advert = Get-Content -Raw $advertPath | ConvertFrom-Json } catch { $advert = $null }
                }
                $observed = $advert.window_observation
                $sqx = @(Get-Process -Name "StrategyQuantX","StrategyQuantX_ui","sqcli" -ErrorAction SilentlyContinue)
                if ($sqx.Count -gt 0) {
                  throw "Packaged Research desktop launched StrategyQuant X during ordinary startup"
                }
                $window = $processes | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
                if (
                  $null -ne $response -and
                  $response.StatusCode -eq 200 -and
                  $response.Content -match "<title>TraderCockpit</title>" -and
                  $response.Content -match 'src="/app.mjs"' -and
                  $response.Content -match 'src="/research-proof.mjs"' -and
                  $null -ne $advert -and
                  $advert.schema -eq "tc.desktop-loopback.v1" -and
                  $advert.product -eq "tradercockpit" -and
                  $advert.url -eq "http://127.0.0.1:4174/research" -and
                  $null -ne $observed -and
                  $observed.schema -eq "tc.desktop-window-observation.v1" -and
                  $observed.location_pathname -eq "/research" -and
                  $observed.location_search -eq "" -and
                  $observed.document_title -eq "TraderCockpit — Research / Construct / Idea" -and
                  $observed.product_shell -eq "tradercockpit-desktop" -and
                  $observed.surface_id -eq "research" -and
                  $observed.research_stage_id -eq "construct" -and
                  $observed.research_tab_id -eq "idea" -and
                  $observed.idea_workspace -eq $true -and
                  $observed.idea_save_action -eq $true -and
                  $null -ne $researchCatalog -and
                  $researchCatalog.schema -eq "tc.research-idea-catalog.v1" -and
                  @($researchCatalog.ideas).Count -eq 1 -and
                  $researchCatalog.ideas[0].entity_id -eq $created.entity_id -and
                  $researchCatalog.ideas[0].revision -eq $created.revision -and
                  $null -ne $window -and
                  $window.MainWindowTitle -eq "TraderCockpit"
                ) {
                  $researchReady = $true
                  $researchWindow = $window
                  break
                }
              }
              if (-not $researchReady -or $null -eq $researchWindow) {
                throw "Packaged TraderCockpit did not report the actual rendered Research / Construct / Idea WebView DOM"
              }

              Start-Sleep -Seconds 2
              $researchWindow.Refresh()
              if ($researchWindow.HasExited -or $researchWindow.MainWindowHandle -eq 0) {
                throw "Packaged TraderCockpit Research WebView2 window did not remain alive"
              }
              $advert = Get-Content -Raw $advertPath | ConvertFrom-Json
              $observed = $advert.window_observation
              if (
                $null -eq $observed -or
                $observed.schema -ne "tc.desktop-window-observation.v1" -or
                $observed.product_shell -ne "tradercockpit-desktop" -or
                $observed.surface_id -ne "research" -or
                $observed.research_stage_id -ne "construct" -or
                $observed.research_tab_id -ne "idea" -or
                $observed.idea_workspace -ne $true -or
                $observed.idea_save_action -ne $true
              ) {
                throw "Packaged TraderCockpit Research WebView2 lost its rendered Research DOM identity"
              }
              if (-not $researchWindow.CloseMainWindow()) {
                throw "Packaged TraderCockpit Research window refused graceful close"
              }
              $deadline = [DateTime]::UtcNow.AddSeconds(20)
              do {
                Start-Sleep -Milliseconds 250
                $remaining = @(Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue)
              } while ($remaining.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline)
              if ($remaining.Count -gt 0) {
                throw "Packaged TraderCockpit processes survived graceful Research window close"
              }
              $researchServerStillAlive = $false
              try {
                $null = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4174/research" -TimeoutSec 2
                $researchServerStillAlive = $true
              } catch {
                $researchServerStillAlive = $false
              }
              if ($researchServerStillAlive) {
                throw "Packaged TraderCockpit loopback server survived graceful Research window close"
              }
            } finally {
              Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue | Stop-Process -Force
            }
          } finally {
            Get-Process -Name "TraderCockpit" -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderCockpit-windows
          path: dist/windows/TraderCockpit.exe
          if-no-files-found: error
          retention-days: 7
