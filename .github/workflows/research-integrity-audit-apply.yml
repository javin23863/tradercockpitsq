name: Research Integrity Audit Apply

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - .github/scripts/apply_research_integrity_audit.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove static native generation allowlist
        run: python .github/scripts/apply_research_integrity_audit.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Specification integrity tests
        run: |
          python -m unittest tests.product.test_research_specification tests.product.test_sqx_builder_config tests.product.test_research_configurations -v
          python tools/check_production_boundary.py --root .
      - name: Commit Research integrity correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tradercockpit/sqx_builder_config.py tests/product/test_research_specification.py
          git diff --cached --quiet && exit 0
          git commit -m "Delegate Builder generation type validity to SQX"
          git push origin HEAD:research/vertical-completion
