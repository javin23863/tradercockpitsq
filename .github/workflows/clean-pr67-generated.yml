name: Clean PR67 Generated Artifacts

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - .github/workflows/clean-pr67-generated.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vertical-completion
      - name: Remove generated test/install artifacts
        run: |
          rm -rf node_modules
          rm -rf product/tradercockpit/__pycache__
          rm -rf tests/product/__pycache__
          rm -rf product/tradercockpit_core.egg-info
          rm .github/workflows/clean-pr67-generated.yml
      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated PR67 test artifacts"
          git push origin HEAD:research/vertical-completion