name: Finalize Robustness Artifact Cleanup

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - .github/workflows/cleanup-robustness-generated-artifacts-final.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - name: Remove generated and temporary files
        run: |
          git rm -r --ignore-unmatch product/tradercockpit/__pycache__
          git rm -r --ignore-unmatch tests/product/__pycache__
          git rm -r --ignore-unmatch product/tradercockpit_core.egg-info
          git rm --ignore-unmatch .github/workflows/cleanup-robustness-generated-artifacts.yml
          rm .github/workflows/cleanup-robustness-generated-artifacts-final.yml
          git add -u
          git diff --cached --check
      - name: Commit cleanup
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git commit -m "Remove generated robustness test artifacts"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
