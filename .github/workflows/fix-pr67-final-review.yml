name: Fix PR67 Final Review
# Authenticated retrigger after repairing the temporary patch script.

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - tools/apply_pr67_final_review_fixes.py
      - .github/workflows/fix-pr67-final-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vertical-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply final review fixes
        run: python tools/apply_pr67_final_review_fixes.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Focused backend regressions
        run: |
          python -m unittest tests.product.test_research_proof -v
          python -m unittest tests.product.test_research_proof_http -v
          python -m unittest tests.product.test_research_robustness -v
      - name: Frontend proof tests
        run: |
          node --check web/research-proof.mjs
          node --test tests/research-proof.test.mjs
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Real persisted Proof restart acceptance
        run: node tests/run-browser-proof-regression.mjs
      - name: Remove temporary correction machinery
        run: rm tools/apply_pr67_final_review_fixes.py .github/workflows/fix-pr67-final-review.yml
      - name: Commit corrected tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final Research Proof review findings"
          git push origin HEAD:research/vertical-completion