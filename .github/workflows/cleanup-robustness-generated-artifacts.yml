name: Clean Robustness Generated Artifacts

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - .github/workflows/cleanup-robustness-generated-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - name: Remove generated artifacts only
        run: |
          git rm -r --ignore-unmatch product/tradercockpit/__pycache__
          git rm -r --ignore-unmatch tests/product/__pycache__
          git rm -r --ignore-unmatch product/tradercockpit_core.egg-info
          rm .github/workflows/cleanup-robustness-generated-artifacts.yml
          git add -u
          test -z "$(git status --porcelain | grep -E '^\?\?' || true)"
      - name: Verify intended PR paths
        run: |
          allowed='^(.github/workflows/product-runtime-acceptance.yml|product/tradercockpit/research_retester_http.py|product/tradercockpit/research_robustness.py|product/tradercockpit/sqx_gateway.py|tests/product/test_research_robustness.py|tests/product/test_research_robustness_http_boundary.py|tests/product/test_research_robustness_preservation.py|tests/product/test_sqx_retester_gateway.py|tests/research-backtest-robustness.test.mjs|tests/run-browser-robustness-regression.mjs|web/index.html|web/research-backtest-robustness.mjs)$'
          bad=$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Commit cleanup
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git commit -m "Remove generated robustness test artifacts"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
