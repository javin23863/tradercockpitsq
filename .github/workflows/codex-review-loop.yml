name: Codex Review Loop

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  codex-review-loop:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    concurrency:
      group: codex-review-loop-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Track final-prototype Codex closure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statusContext = 'Codex Review Closure';
            const codexActors = new Set(['chatgpt-codex-connector', 'chatgpt-codex-connector[bot]']);
            const workflowActor = 'github-actions[bot]';
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const number = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const head = pr.head.sha;
            const targetUrl = pr.html_url;
            const labels = new Set((pr.labels || []).map((label) => label.name));
            const finalPrototype = labels.has('final-prototype-review');

            const setStatus = async (state, description) => github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: head,
              state,
              context: statusContext,
              description: description.slice(0, 140),
              target_url: targetUrl,
            });

            if (!finalPrototype) {
              await setStatus('success', 'Codex closure reserved for final prototype review');
              return;
            }

            const reviewedCommit = (body) => {
              const match = (body || '').match(/\*\*Reviewed commit:\*\*\s*`([0-9a-f]{7,40})`/i);
              return match ? match[1].toLowerCase() : null;
            };
            const matchesHead = (body) => {
              const reviewed = reviewedCommit(body);
              return reviewed !== null && head.startsWith(reviewed);
            };
            const isCleanBody = (body) =>
              /Codex Review:\s*Didn't find any major issues/i.test(body || '');
            const quotaPattern =
              /reached your Codex usage limits for code reviews|Codex.*code review.*(?:unavailable|usage limit|quota)/i;

            const unresolvedCodexInline = async () => {
              const data = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        pageInfo { hasNextPage }
                        nodes {
                          isResolved
                          comments(first: 1) {
                            nodes { databaseId author { login } }
                          }
                        }
                      }
                    }
                  }
                }`,
                {owner, repo, number},
              );
              const threads = data.repository.pullRequest.reviewThreads;
              if (threads.pageInfo.hasNextPage) return true;
              return threads.nodes.some((thread) => {
                if (thread.isResolved) return false;
                const login = thread.comments.nodes[0]?.author?.login || '';
                return codexActors.has(login);
              });
            };

            const inspectCurrentHead = async () => {
              if (await unresolvedCodexInline()) {
                return {
                  state: 'failure',
                  description: 'Unresolved Codex inline feedback remains on final prototype',
                };
              }

              const issueComments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number: number, per_page: 100},
              );
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {owner, repo, pull_number: number, per_page: 100},
              );
              const activity = [];
              let latestQuotaAt = 0;

              for (const comment of issueComments) {
                if (!codexActors.has(comment.user?.login || '')) continue;
                const at = new Date(comment.created_at || 0).getTime();
                if (quotaPattern.test(comment.body || '')) latestQuotaAt = Math.max(latestQuotaAt, at);
                if (!matchesHead(comment.body)) continue;
                if (!/^Codex Review:/i.test((comment.body || '').trim())) continue;
                activity.push({
                  at,
                  clean: isCleanBody(comment.body),
                });
              }

              for (const review of reviews) {
                if (!codexActors.has(review.user?.login || '')) continue;
                if (review.commit_id !== head && !matchesHead(review.body)) continue;
                activity.push({
                  at: new Date(review.submitted_at || 0).getTime(),
                  clean:
                    (review.state || '').toLowerCase() === 'approved' ||
                    isCleanBody(review.body),
                });
              }

              activity.sort((left, right) => right.at - left.at);
              const latest = activity[0] || null;
              if (!latest) {
                return {
                  state: 'pending',
                  description: latestQuotaAt > 0
                    ? 'Codex final review unavailable due to quota; merge remains blocked'
                    : 'Waiting for exact-head Codex final review',
                };
              }
              if (latestQuotaAt > latest.at) {
                return {
                  state: 'pending',
                  description: 'Newer Codex quota refusal exists; final review remains pending',
                };
              }
              return latest.clean
                ? {state: 'success', description: 'Latest exact-head Codex final review is clean'}
                : {state: 'failure', description: 'Latest exact-head Codex final review has findings'};
            };

            const notifyReviewNeeded = async () => {
              const marker = `<!-- codex-final-review-needed:${head} -->`;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number: number, per_page: 100},
              );
              if (comments.some(
                (comment) =>
                  comment.user?.login === workflowActor &&
                  comment.body?.includes(marker),
              )) return;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body:
                  `Final prototype Codex review required for exact head \`${head}\`. ` +
                  'An authenticated collaborator or assistant must post `@codex review` ' +
                  'for this head. After Codex responds, post `/codex-review-closure recheck` ' +
                  'if closure does not refresh automatically.\n' + marker,
              });
            };

            if (context.eventName === 'pull_request_target') {
              await setStatus('pending', 'Final prototype requires exact-head Codex closure');
              await notifyReviewNeeded();
              return;
            }

            const comment = context.payload.comment;
            const body = (comment.body || '').trim();
            const actor = comment.user?.login || context.actor;
            const trustedRecheck =
              body === '/codex-review-closure recheck' &&
              trusted.has(comment.author_association);
            const trustedRequest =
              /(?:^|\s)@codex\s+review(?:\s|$)/i.test(body) &&
              trusted.has(comment.author_association);
            if (!codexActors.has(actor) && !trustedRecheck && !trustedRequest) return;
            if (trustedRequest) {
              await setStatus('pending', 'Waiting for exact-head Codex final review');
              return;
            }
            const result = await inspectCurrentHead();
            await setStatus(result.state, result.description);
