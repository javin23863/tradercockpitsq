name: Repair Robustness Finalizer

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - ".github/workflows/fix-finalize-robustness-script.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
      - name: Add exact second-baseline receipt fixture transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/finalize_robustness_review.py')
          text = p.read_text(encoding='utf-8')
          marker = '# The earlier staged patch scripts are now superseded by the tested product implementation.\n'
          insertion = '''# Keep the second-baseline catalog fixture's nested native receipt bound to the same source archive.\nreplace_once(\n    "tests/research-backtest-robustness.test.mjs",\n    \'\'\'    source_result_archive_sha256: second.result_archive_sha256,\\n    result_archive_ref: `tc-evidence:sha256:${"7".repeat(64)}`,\\n\'\'\',\n    \'\'\'    source_result_archive_sha256: second.result_archive_sha256,\\n    receipts: [{ ...robustness().receipts[0], result_archive_sha256: second.result_archive_sha256 }],\\n    result_archive_ref: `tc-evidence:sha256:${"7".repeat(64)}`,\\n\'\'\',\n)\n\n'''
          if insertion in text:
              raise SystemExit('fixture transform already present')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, found {text.count(marker)}')
          p.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')
          PY
          python -m py_compile .github/scripts/finalize_robustness_review.py
      - name: Commit repaired finalizer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/finalize_robustness_review.py
          git commit -m "Repair robustness catalog fixture transform"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
