name: Research Vertical Apply

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - .github/scripts/apply_research_proof_app_server.py
      - .github/workflows/research-vertical-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded Proof app-server patch
        run: python .github/scripts/apply_research_proof_app_server.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Proof and server tests
        run: |
          python -m unittest tests.product.test_research_proof tests.product.test_research_proof_http -v
          python -m unittest tests.product.test_app_server -v
      - name: Commit canonical app-server wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tradercockpit/app_server.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire Research Proof into canonical server"
          git push origin HEAD:research/vertical-completion
