name: Installed SQX Acceptance

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  installed-sqx-acceptance:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Track exact-head installed SQX exercise
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const statusContext = 'Installed SQX Acceptance';
            const nativeIntegrationPath = /^product\/tradercockpit\/(?:sqx_|research_(?:configurations|native_jobs|candidates|retester|trades|robustness(?:_[^/]+)?|backtest_configuration))/;
            const number = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const head = pr.head.sha;
            const targetUrl = pr.html_url;

            const setStatus = async (state, description) => github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: head,
              state,
              context: statusContext,
              description: description.slice(0, 140),
              target_url: targetUrl,
            });

            const bodyField = (label) => {
              const match = (pr.body || '').match(new RegExp(`^${label}:\\s*(.+)$`, 'mi'));
              return match ? match[1].trim().replace(/^`|`$/g, '') : null;
            };

            const readPlan = async () => {
              const {data: branch} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
              const {data} = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'LIVING_IMPLEMENTATION_PLAN.md',
                ref: branch.commit.sha,
              });
              if (Array.isArray(data) || data.type !== 'file' || !data.content) return null;
              return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            };

            const nativeRequiredItems = (text) => {
              if (!text) return null;
              const block = text.match(/<!--\s*delivery-integrity([\s\S]*?)-->/m);
              if (!block) return null;
              const fields = {};
              for (const raw of block[1].split(/\r?\n/)) {
                const line = raw.trim();
                if (!line) continue;
                const split = line.indexOf(':');
                if (split <= 0) continue;
                fields[line.slice(0, split).trim()] = line.slice(split + 1).trim();
              }
              const raw = fields['installed-sqx-required-items'];
              if (!raw) return null;
              return new Set(raw.split(',').map((value) => value.trim()).filter((value) => value && value !== 'none'));
            };

            const planItem = bodyField('Living plan item');
            const declaredRequired = bodyField('Native producer acceptance') === 'required';
            const requiredItems = nativeRequiredItems(await readPlan());
            const bootstrap = requiredItems === null && planItem === 'delivery-governance';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            const nativeBoundaryChanged = files.some((item) => nativeIntegrationPath.test(item.filename));
            const planRequired = requiredItems !== null && requiredItems.has(planItem || '');
            const required = !bootstrap && (planRequired || nativeBoundaryChanged || declaredRequired);

            if (!required) {
              await setStatus('success', bootstrap
                ? 'Governance bootstrap: installed SQX exercise not applicable'
                : 'Installed SQX exercise not required by current slice');
              return;
            }

            if (context.eventName === 'pull_request_target') {
              await setStatus('pending', 'Exact-head installed SQX receipt attestation required');
              return;
            }

            const comment = context.payload.comment;
            if (!trusted.has(comment.author_association)) return;
            const match = (comment.body || '').trim().match(
              /^\/installed-sqx-accept\s+([0-9a-f]{40})\s+receipt=([0-9a-f]{64})\s+scenario=([A-Za-z0-9._-]{1,64})$/i,
            );
            if (!match) return;
            const acceptedHead = match[1].toLowerCase();
            const receipt = match[2].toLowerCase();
            const scenario = match[3];
            if (acceptedHead !== head) {
              core.setFailed(`Acceptance targets ${acceptedHead}, but current PR head is ${head}.`);
              return;
            }
            await setStatus(
              'success',
              `Operator-attested installed SQX receipt ${receipt.slice(0, 12)} for ${scenario}`,
            );
