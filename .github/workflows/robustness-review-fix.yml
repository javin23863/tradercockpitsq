name: Apply Robustness Review Fix

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply review corrections
        run: python tools/apply_robustness_review_fix.py
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Focused correction acceptance
        run: |
          python tools/check_production_boundary.py --root .
          python -m unittest tests.product.test_research_robustness tests.product.test_research_robustness_http_boundary -v
          node --check web/research-backtest-robustness.mjs
          node --test tests/research-backtest-robustness.test.mjs
      - name: Commit corrected exact head
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/robustness-review-fix.yml tools/apply_robustness_review_fix.py
          git add -A
          git commit -m "Persist and surface native robustness custody"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
