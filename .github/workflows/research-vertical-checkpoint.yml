name: Research Vertical Checkpoint

on:
  push:
    branches:
      - research/vertical-completion

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Research Proof focused tests
        run: python -m unittest tests.product.test_research_proof tests.product.test_research_proof_http -v
      - name: Full product suite
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - name: Frontend syntax
        run: |
          node --check web/app.mjs
          node --check web/research-proof.mjs
      - name: Full frontend suite
        run: npm test
