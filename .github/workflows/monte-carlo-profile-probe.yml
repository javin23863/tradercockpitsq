name: Monte Carlo Profile Probe

on:
  pull_request:
    paths:
      - "tests/product/test_research_robustness_monte_carlo_retained_probe.py"
      - ".github/workflows/monte-carlo-profile-probe.yml"

jobs:
  retained-profile-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emit retained native Monte Carlo profile
        run: python -m unittest tests.product.test_research_robustness_monte_carlo_retained_probe -v
      - name: Upload retained Monte Carlo profile
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-profile-probe
          path: monte-carlo-profile-probe.json
          if-no-files-found: error
          retention-days: 1
