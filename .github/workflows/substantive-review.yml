name: Substantive Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  substantive-review:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const statusContext = 'Substantive Review';
            let number;
            if (context.eventName === 'pull_request') number = context.payload.pull_request.number;
            else if (context.eventName === 'pull_request_review') number = context.payload.pull_request.number;
            else number = context.payload.issue.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const head = pr.head.sha;
            const setStatus = async (state, description) => github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: head,
              state,
              context: statusContext,
              description: description.slice(0, 140),
              target_url: pr.html_url,
            });

            if (context.eventName === 'pull_request') {
              await setStatus('pending', 'Exact-head adversarial review required');
              return;
            }

            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review;
              if (
                review.state === 'approved' &&
                trusted.has(review.author_association) &&
                review.commit_id === head
              ) {
                await setStatus('success', `Approved exact-head review by ${review.user.login}`);
              }
              return;
            }

            const comment = context.payload.comment;
            if (!trusted.has(comment.author_association)) return;
            const accept = (comment.body || '').trim().match(
              /^\/substantive-review\s+accept\s+([0-9a-f]{40})\s+(.+)$/i,
            );
            const reject = (comment.body || '').trim().match(
              /^\/substantive-review\s+reject\s+([0-9a-f]{40})\s+(.+)$/i,
            );
            const command = accept || reject;
            if (!command) return;
            const reviewedHead = command[1].toLowerCase();
            if (reviewedHead !== head) {
              core.setFailed(`Review attestation targets ${reviewedHead}, but current PR head is ${head}.`);
              return;
            }
            if (accept) {
              await setStatus('success', `External adversarial review accepted: ${accept[2].trim()}`);
            } else {
              await setStatus('failure', `External adversarial review has blockers: ${reject[2].trim()}`);
            }
