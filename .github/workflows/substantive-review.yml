name: Substantive Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  substantive-review:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Track exact-head adversarial review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const codexActors = new Set(['chatgpt-codex-connector', 'chatgpt-codex-connector[bot]']);
            const statusContext = 'Substantive Review';
            const number = context.eventName === 'issue_comment'
              ? context.payload.issue.number
              : context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const head = pr.head.sha;
            const targetUrl = pr.html_url;

            const setStatus = async (state, description) => github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: head,
              state,
              context: statusContext,
              description: description.slice(0, 140),
              target_url: targetUrl,
            });

            if (context.eventName === 'pull_request_target') {
              await setStatus('pending', 'Exact-head adversarial review evidence required');
              return;
            }

            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review;
              const actor = review.user?.login || context.actor;
              if (review.commit_id !== head) return;
              const state = (review.state || '').toLowerCase();
              const cleanCodex = /Codex Review:\s*Didn't find any major issues/i.test(review.body || '');
              if (codexActors.has(actor)) {
                if (state === 'approved' || cleanCodex) {
                  await setStatus('success', `Exact-head Codex adversarial review clean at ${head.slice(0, 12)}`);
                } else {
                  await setStatus('failure', `Exact-head Codex review has findings at ${head.slice(0, 12)}`);
                }
                return;
              }
              if (!trusted.has(review.author_association)) return;
              if (state === 'approved') {
                await setStatus('success', `Exact-head GitHub review approved by ${actor}`);
              } else if (state === 'changes_requested') {
                await setStatus('failure', `Exact-head GitHub review requests changes from ${actor}`);
              }
              return;
            }

            const comment = context.payload.comment;
            const body = (comment.body || '').trim();
            const actor = comment.user?.login || context.actor;

            if (codexActors.has(actor)) {
              const reviewed = body.match(/\*\*Reviewed commit:\*\*\s*`([0-9a-f]{7,40})`/i)?.[1]?.toLowerCase();
              const clean = /Codex Review:\s*Didn't find any major issues/i.test(body);
              if (clean && reviewed && head.startsWith(reviewed)) {
                await setStatus('success', `Exact-head Codex adversarial review clean at ${reviewed}`);
              }
              return;
            }

            if (!trusted.has(comment.author_association)) return;
            const accept = body.match(
              /^\/substantive-review\s+accept\s+([0-9a-f]{40})\s+reviewer=([A-Za-z0-9._-]{1,64})\s+evidence=(\S{1,200})$/i,
            );
            const reject = body.match(
              /^\/substantive-review\s+reject\s+([0-9a-f]{40})\s+reviewer=([A-Za-z0-9._-]{1,64})\s+evidence=(\S{1,200})$/i,
            );
            const command = accept || reject;
            if (!command) return;
            const reviewedHead = command[1].toLowerCase();
            const reviewer = command[2];
            const evidence = command[3];
            if (reviewedHead !== head) {
              core.setFailed(`Review evidence targets ${reviewedHead}, but current PR head is ${head}.`);
              return;
            }
            if (accept) {
              await setStatus('success', `Operator-attested adversarial review by ${reviewer}; evidence ${evidence}`);
            } else {
              await setStatus('failure', `Adversarial review by ${reviewer} has blockers; evidence ${evidence}`);
            }
