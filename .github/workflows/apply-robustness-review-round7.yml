name: Apply Robustness Review Round Seven

on:
  push:
    branches:
      - codex/merge-native-sqx-robustness-higher-precision
    paths:
      - ".github/workflows/apply-robustness-review-round7.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-native-sqx-robustness-higher-precision
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact blocked product base
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only 60a2b54576bf67eff78f8661fe317065f8961e0f..HEAD)
          printf '%s\n' "$changed"
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(\.github/scripts/apply_robustness_review_round7.py|\.github/workflows/apply-robustness-review-round7.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected drift from blocked product base:"
            echo "$unexpected"
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
      - name: Install clean production package
        run: python -m pip install --no-deps -e .
      - name: Apply exact seventh-round corrections
        run: python .github/scripts/apply_robustness_review_round7.py
      - name: Python syntax
        run: python -m py_compile product/tradercockpit/research_robustness.py product/tradercockpit/sqx_gateway.py tests/product/test_research_robustness.py tests/product/test_sqx_retester_gateway.py
      - name: Focused seventh-round regressions
        run: python -m unittest tests.product.test_research_robustness tests.product.test_sqx_retester_gateway -v
      - name: Frontend focused regression
        run: node --test tests/research-backtest-robustness.test.mjs
      - name: Full product suite
        run: python -m unittest discover -s tests/product -p 'test_*.py' -v
      - name: Frontend syntax and UI suite
        run: |
          node --check web/research-backtest-robustness.mjs
          node --check tests/research-backtest-robustness.test.mjs
          npm test
      - name: Production boundary
        run: python tools/check_production_boundary.py --root .
      - name: Remove temporary correction artifacts and generated files
        shell: bash
        run: |
          rm -f .github/scripts/apply_robustness_review_round7.py .github/workflows/apply-robustness-review-round7.yml
          find product tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf product/tradercockpit_core.egg-info
      - name: Diff scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(\.github/(scripts/apply-robustness-review-round7.py|workflows/apply-robustness-review-round7.yml)|product/tradercockpit/(research_robustness.py|sqx_gateway.py)|tests/product/(test_research_robustness.py|test_sqx_retester_gateway.py)|tests/research-backtest-robustness.test.mjs|web/research-backtest-robustness.mjs)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve seventh-round robustness review findings"
          git push origin HEAD:codex/merge-native-sqx-robustness-higher-precision
