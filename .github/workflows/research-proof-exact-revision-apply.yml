name: Research Proof Exact Revision Apply

on:
  push:
    branches:
      - research/vertical-completion
    paths:
      - .github/scripts/apply_research_proof_exact_revision.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact-revision Proof readback correction
        run: python .github/scripts/apply_research_proof_exact_revision.py
      - name: Install product package
        run: python -m pip install --no-deps -e .
      - name: Proof and source custody tests
        run: |
          python -m unittest tests.product.test_research_proof -v
          python -m unittest tests.product.test_research_configurations tests.product.test_research_native_jobs tests.product.test_research_candidates -v
      - name: Commit exact-revision correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tradercockpit/research_configurations.py product/tradercockpit/research_native_jobs.py product/tradercockpit/research_candidates.py product/tradercockpit/research_proof.py tests/product/test_research_proof.py
          git diff --cached --quiet && exit 0
          git commit -m "Read exact bound revisions from Research Proof"
          git push origin HEAD:research/vertical-completion
